name: Build IPA

on:
  workflow_dispatch:        # 允许在 GitHub 网页上手动点按钮触发
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15          # 默认 Xcode 16，能打开 XcodeGen/CocoaPods 生成的新工程格式(format 77)
    steps:
      - uses: actions/checkout@v4

      # ⓪ 选最新的 Xcode 16，避免默认落到旧版本打不开新工程格式
      - name: Select latest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$latest" ]; then latest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1); fi
          echo "Using $latest"
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version

      # ① 先把密钥从 GitHub Secrets 注入成 Secrets.swift —— 必须在 xcodegen 之前，
      #    否则 xcodegen 扫描源码时找不到这个文件、不会纳入工程。
      - name: Inject secrets
        run: |
          HOST="${{ secrets.MINIMAX_HOST }}"; [ -z "$HOST" ] && HOST="https://api.minimaxi.com"
          MODEL="${{ secrets.MINIMAX_MODEL }}"; [ -z "$MODEL" ] && MODEL="speech-02-hd"
          SPEED="${{ secrets.MINIMAX_SPEED }}"; [ -z "$SPEED" ] && SPEED="1.0"
          cat > Sources/Secrets.swift <<EOF
          enum Secrets {
              static let amapKey        = "${{ secrets.AMAP_IOS_KEY }}"
              static let minimaxGroupId = "${{ secrets.MINIMAX_GROUP_ID }}"
              static let minimaxApiKey  = "${{ secrets.MINIMAX_API_KEY }}"
              static let minimaxVoiceId = "${{ secrets.MINIMAX_VOICE_ID }}"
              static let minimaxHost    = "$HOST"
              static let minimaxModel   = "$MODEL"
              static let minimaxSpeed   = "$SPEED"
          }
          EOF

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install CocoaPods deps
        run: pod install --repo-update

      - name: Build unsigned archive
        run: |
          xcodebuild archive \
            -workspace NavApp.xcworkspace \
            -scheme NavApp \
            -configuration Release \
            -archivePath build/NavApp.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          cd build
          mkdir -p Payload
          cp -r NavApp.xcarchive/Products/Applications/NavApp.app Payload/
          zip -r NavApp.ipa Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NavApp-ipa
          path: build/NavApp.ipa
          if-no-files-found: error
